[package]
name = "typed-decisions-heuristic"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: built on demand with --manifest-path, never part of the default
# workspace (same pattern as the other benchmark crates).
[workspace]

[dependencies]
axil-core = { path = "../../../crates/axil-core" }
axil-vector = { path = "../../../crates/engines/axil-vector", features = ["embed"] }
serde_json = "1"
