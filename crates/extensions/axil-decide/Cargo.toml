[package]
name = "axil-decide"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Small local models for Axil's judgement calls: a calibrated ONNX pair classifier"
# Nothing calls it yet. Publish it together with the CLI feature that first
# uses it (crates.io needs every optional dependency of `axildb` published).
publish = false

[dependencies]
axil-core.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
ort = { workspace = true, features = ["download-binaries", "std"] }
tokenizers = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
