# Prebuilt-binary release workflow — HAND-AUTHORED, the source of truth.
#
# Do NOT run `dist init` / `dist generate` to "refresh" this. cargo-dist's
# generated workflow would be a SECOND file (`axildb-release.yml`) triggering on
# the same `axildb-v*` tag (racing this one), and it CANNOT bundle the
# build-time `onnxruntime.dll` (cargo-dist's `include` is repo-relative; the lib
# lands in `target/<triple>/release/`). The explicit copy step below is the
# load-bearing fix for the Windows ORT-init failure, so this matrix stays
# hand-authored. `dist-workspace.toml` is kept only to back the `dist plan`
# sanity check job.
#
# Scope: this builds the six triples (onnxruntime statically linked — the
# archives are self-contained) and uploads them to the GitHub Release. The
# one-line `curl|sh` / `irm|iex` installers live in scripts/install.sh and
# scripts/install.ps1; they consume these archives directly from
# releases/latest/download, so NO full cargo-dist adoption is required for
# them. An `axil-update` self-updater is still not produced.
#
# Trigger: release-plz emits PER-CRATE tags like `axildb-v1.2.0` (NOT a bare
# `v1.2.0`). This runs AFTER release-plz pushes that tag and UPLOADS assets to
# the Release release-plz already created — the two coexist (release-plz owns
# crate publishing + the Release object; this workflow owns the prebuilt
# archives).
#
# GITHUB_TOKEN gotcha: a tag pushed by release-plz using the default
# GITHUB_TOKEN does NOT trigger this `on: push: tags` workflow — GitHub blocks
# workflow-token pushes from triggering other workflows (loop prevention).
# workflow_dispatch is exempt from that rule, so release-plz.yml dispatches
# this workflow for the new `axildb` tag right after releasing. The same
# dispatch recovers an older tag by hand — e.g.
# `gh workflow run release.yml -f tag=axildb-v2.0.0` — without touching the
# published tag. If release-plz is ever given a PAT, its tag push triggers this
# workflow too; the per-tag concurrency group below serializes the two runs and
# `--clobber` makes the second upload idempotent.
name: release

on:
  push:
    tags:
      # Per-crate tag for the `axildb` CLI only (binary `axil`). Must match the
      # `tag-namespace = "axildb"` in dist-workspace.toml — a bare `v*` would
      # never recur under release-plz and the job would never fire.
      - "axildb-v*"
  # Manual (re)build of an existing tag's archives — see the GITHUB_TOKEN gotcha
  # above. Builds the tagged code and uploads to that tag's existing Release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build archives for, e.g. axildb-v2.0.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # for github-attestations provenance
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Tag to build/upload: the dispatched input when present, else the pushed tag.
  REL_TAG: ${{ inputs.tag || github.ref_name }}

# One run per tag at a time: a tag-push run and a dispatched run for the same
# tag must not upload over each other mid-flight.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Enumerate the planned artifacts; a green plan proves the config resolves all
  # six triples (and surfaces a missing prebuilt `ort` artifact early).
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REL_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-dist
        run: cargo install cargo-dist --version 0.31.0 --locked || cargo install cargo-dist --locked
      - name: dist plan
        run: dist plan --output-format=json

  build:
    name: build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            # macos-15, NOT macos-latest: the latter migrated to macOS 26, and
            # we need an image that still ships an Xcode 16.x to select below.
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            # Native ARM runner: cross-linking aarch64-linux on an x86 runner has
            # no cross-linker (the `build axil` step fails). Requires GitHub's
            # public-repo ARM runners.
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REL_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Skip the build cache on macOS. A restored cache replays stale, absolute
      # link-search paths that ort_sys/rustc baked under a different Xcode (e.g.
      # `-L /Applications/Xcode_26.5.app/.../clang/21/lib/darwin` and a one-shot
      # ort download dir) — both vanish on a fresh runner, so the link dies with
      # "library 'clang_rt.osx' not found". A clean build re-runs the build
      # scripts under the Xcode selected below. (Release builds are infrequent;
      # a clean macOS build is the safer choice for shipped artifacts anyway.)
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'macOS'
      # GitHub bumped the *default* Xcode on the macOS images to 26.x, whose
      # clang-21 resource-dir layout lacks libclang_rt.osx.a where rustc looks,
      # so the `-lclang_rt.osx` rustc emits dies at link. Force the newest
      # installed pre-26 Xcode via DEVELOPER_DIR (authoritative — overrides any
      # inherited value) for every later step.
      - name: Select a pre-26 Xcode (clang_rt.osx link fix)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app || true
          sel=""
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V); do
            ver=$(basename "$app" | sed -E 's/Xcode_([0-9]+).*/\1/')
            if [ "$ver" -lt 26 ] 2>/dev/null; then sel="$app"; fi
          done
          if [ -n "$sel" ]; then
            echo "Selecting $sel"
            sudo xcode-select -s "$sel/Contents/Developer"
            echo "DEVELOPER_DIR=$sel/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "::warning::No pre-26 Xcode found; using default $(xcode-select -p)"
          fi
          cc --version || true
      # Build the `axil` binary with default features (includes `embed`, which
      # STATICALLY links onnxruntime via ort's `download-binaries` — the binary
      # is self-contained, no runtime onnxruntime library needed).
      - name: build axil
        run: cargo build --release -p axildb --target ${{ matrix.target }}
      # onnxruntime is statically linked into `axil` (the runner cache holds only
      # libonnxruntime.a / onnxruntime.lib — there is NO .so/.dylib/.dll), so the
      # archive is just the self-contained binary; nothing to bundle alongside.
      - name: stage archive
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          stage="axildb-${{ matrix.target }}"
          mkdir -p "$stage"
          if [ -f "$out/axil.exe" ]; then cp "$out/axil.exe" "$stage/"; else cp "$out/axil" "$stage/"; fi
      - name: archive
        shell: bash
        run: |
          set -euo pipefail
          stage="axildb-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*) 7z a "$stage.zip" "$stage" ;;
            *)         tar czf "$stage.tar.gz" "$stage" ;;
          esac
      - name: attest provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "axildb-${{ matrix.target }}.*"
      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$REL_TAG" axildb-${{ matrix.target }}.* --clobber
