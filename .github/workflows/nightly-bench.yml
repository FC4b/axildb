name: nightly-bench

# Nightly checks that are too slow or too noisy for the per-PR gate.
#
# Criterion latency regression watch: runs the 4 in-tree
# hot-path suites (core/vector/graph/fts) via scripts/bench-check.sh and
# surfaces >5% regressions vs the previous night's baseline as WARNINGS —
# informational, never blocking. Criterion variance on shared CI runners is
# real (eval-log.md classifies +6–10% single-run swings as noise), so this is
# deliberately NOT a per-PR blocking gate.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion:
    name: criterion latency watch (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Persist the Criterion "main" baseline across nightly runs so --compare
      # has something to diff against. restore-keys picks up the most recent
      # prior baseline; the run-id-suffixed key writes a fresh one each night.
      - name: restore criterion baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ github.run_id }}
          restore-keys: criterion-baseline-
      # Compare against the restored baseline (if any). Non-blocking: a
      # regression here is a heads-up, not a build failure.
      - name: compare vs previous baseline (warn-only)
        continue-on-error: true
        run: scripts/bench-check.sh --compare
      # Refresh the baseline so tomorrow compares against today.
      - name: save fresh baseline
        run: scripts/bench-check.sh --save

  vector-oracle:
    name: HNSW recall oracle (large N)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The per-PR `test` job runs the recall oracle at the default N=2000 for
      # fast signal; nightly re-runs the same env-scalable tests at N=20000 in
      # release so a recall floor that only droops at scale still trips. Tests
      # are seeded/deterministic and model-free — no dataset, no network.
      - name: HNSW-vs-brute-force recall at N=20000
        env:
          AXIL_ORACLE_N: "20000"
        run: cargo test -p axil-vector --release recall

  ql-fuzz:
    name: AxilQL parser fuzz (nightly, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `axil_ql::parse` is the one genuinely untrusted byte surface (a query
      # string from a console / MCP / argv). cargo-fuzz needs nightly +
      # libFuzzer, so this is nightly-only: a bounded coverage-guided run over
      # the committed seed corpus. Nightly is NOT the per-PR gate (variance and
      # false floors don't belong there), but a genuine crash/hang finding
      # FAILS this run — loud, with a reproducible artifact under
      # fuzz/artifacts/. The fuzz crate is detached from the workspace — build
      # it via its own manifest.
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: ql_parse fuzz run (300s, blocking)
        run: |
          cd fuzz
          cargo +nightly fuzz run ql_parse -- -max_total_time=300 -rss_limit_mb=2048

  harness-build:
    name: benchmark harnesses build
    runs-on: ubuntu-latest
    # The harnesses under benchmarks/ are `exclude`d from the workspace, so the
    # per-PR build never compiles them (sqlite-compare is built by its gate;
    # longmemeval only when its dataset is present). A crate move or an API
    # rename elsewhere can break them with no red check until someone runs one
    # by hand. A nightly `cargo check` of each catches that the next morning.
    # A build break is not noise, so this job fails; being nightly, it never
    # blocks a PR.
    env:
      # One target dir for every harness: they share most dependencies, so
      # after the first check the rest mostly reuse its artifacts. It is the
      # default `target` rust-cache saves.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The list comes from the root Cargo.toml `exclude`, so a new harness is
      # covered the night it lands. Each harness is checked with its default
      # features and then once per optional feature in its own [features]
      # table (longmemeval: rerank and the GPU execution providers), since
      # cfg-gated code rots unseen otherwise. Every check runs even after one
      # fails, so the log names all the broken ones.
      - name: cargo check each excluded harness
        shell: bash
        run: |
          set -uo pipefail
          harnesses=$(sed -n '/^exclude = \[/,/^\]/p' Cargo.toml | grep -o '"benchmarks/[^"]*"' | tr -d '"')
          if [ -z "$harnesses" ]; then
            echo "::error::found no benchmarks/ entries in the root Cargo.toml exclude list"
            exit 1
          fi
          failed=()
          for h in $harnesses; do
            manifest="$h/Cargo.toml"
            features=$(cargo metadata --no-deps --format-version 1 --manifest-path "$manifest" \
              | python3 -c 'import json, sys; m = json.load(sys.stdin); print(" ".join(f for p in m["packages"] for f in p["features"] if f != "default"))')
            for f in "" $features; do
              label="$h${f:+ --features $f}"
              echo "::group::$label"
              if ! cargo check --all-targets --manifest-path "$manifest" ${f:+--features "$f"}; then
                echo "::error::$label does not build"
                failed+=("$label")
              fi
              echo "::endgroup::"
            done
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'broken: %s\n' "${failed[@]}"
            exit 1
          fi
